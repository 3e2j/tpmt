[package]
name = "tpmt-retail-tests"
description = "Tests that read the retail discs in `discs/`. Nothing depends on this crate."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
tpmt-disc.workspace = true
tpmt-tables.workspace = true
tpmt-pipeline.workspace = true

libtest-mimic.workspace = true
rayon.workspace = true

[dev-dependencies]
tpmt-binary.workspace = true
tpmt-archive.workspace = true
tpmt-compression.workspace = true
tpmt-message.workspace = true

# Its own `main`, so it can make one trial per check and image in
# `discs/`, or an ignored one per check when there are none.
[[test]]
name = "formats"
harness = false

# Every Yaz0 stream on the disc, read from the image since an unpack keeps none.
[[test]]
name = "yaz0"
harness = false

# What the game makes of retail files, as `tpmt-tables`'s tables claim it.
[[test]]
name = "tables"
harness = false

[lints]
workspace = true
