[package]
name = "tpmt-retail-tests"
description = "Tests that read the retail discs in `discs/`. Nothing depends on this crate."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
tpmt-archive.workspace = true
tpmt-binary.workspace = true
tpmt-compression.workspace = true
tpmt-disc.workspace = true
tpmt-tables.workspace = true
tpmt-pipeline.workspace = true
tpmt-project.workspace = true

libtest-mimic.workspace = true
rayon.workspace = true

[dev-dependencies]
tpmt-message.workspace = true

# Each binary has its own `main`, so it can make one trial per check and
# image in `discs/`, or an ignored one per check when there are none.

# Every retail file of a format we encode, re-encoded byte for byte.
[[test]]
name = "fidelity"
harness = false

# What the game makes of retail files, as `tpmt-tables`'s tables claim it.
[[test]]
name = "tables"
harness = false

[lints]
workspace = true
