[package]
name = "tpmt-pipeline"
description = "Unpacking a disc into a project and building it back."
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
# Every format the toolkit understands. This crate is the conveyor belt: it
# only moves files through unpack/build. Organising a format's editable
# files, sidecars included, is that format crate's own call to make.
tpmt-archive.workspace = true
tpmt-compression.workspace = true
tpmt-disc.workspace = true
tpmt-binary.workspace = true
tpmt-project.workspace = true
tpmt-report.workspace = true

thiserror.workspace = true
rayon.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
