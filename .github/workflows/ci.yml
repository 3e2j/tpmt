name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Only the retail tests need opt-level 2.
  CARGO_PROFILE_DEV_OPT_LEVEL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bnjbvr/cargo-machete@main

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      - run: cargo clippy --all-targets

  test:
    needs: [format, machete, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
      # The retail tests need the discs.
      - run: cargo nextest run --verbose --no-tests=pass --workspace --exclude tpmt-retail-tests --locked
      # Nextest doesn't run doctests.
      - run: cargo test --doc --workspace --exclude tpmt-retail-tests --locked
