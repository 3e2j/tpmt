[workspace]
resolver = "3"
members = [
    "crates/tpmt*",
    "crates/formats/tpmt-*",
    "crates/formats/jsystem/jmessage",
    "crates/formats/jsystem/jkernel/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/3e2j/tpmt"
license = "CC0-1.0"

[workspace.dependencies]
# Formats: the `Format` trait and every crate that implements it, all under
# `crates/formats/`.
#
# JSystem: crates implementing a format or subsystem owned by a JSystem
# module in the decomp (libs/JSystem/src/<Module>), nested to match.
tpmt-format = { path = "crates/formats/tpmt-format", version = "0.1.0" }
tpmt-jkernel-arc = { path = "crates/formats/jsystem/jkernel/arc", version = "0.1.0" }
tpmt-jkernel-compress = { path = "crates/formats/jsystem/jkernel/compress", version = "0.1.0" }
tpmt-jmessage = { path = "crates/formats/jsystem/jmessage", version = "0.1.0" }

tpmt-bytes = { path = "crates/tpmt-bytes", version = "0.1.0" }
tpmt-disc = { path = "crates/tpmt-disc", version = "0.1.0" }
tpmt-editor = { path = "crates/tpmt-editor", version = "0.1.0" }
tpmt-game = { path = "crates/tpmt-game", version = "0.1.0" }
tpmt-pipeline = { path = "crates/tpmt-pipeline", version = "0.1.0" }

thiserror = "2"
rayon = "1"
libtest-mimic = "0.8"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Not 0.11. That release changed the output type and dropped its LowerHex impl,
# and every digest here is written out as hex.
sha1 = "0.10"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Deny all panics
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
string_slice = "deny"
panic = "deny"
panic_in_result_fn = "deny"
exit = "deny"
unchecked_time_subtraction = "deny"
# Widening casts (u8 as u32, etc.) can't lose information. Truncating casts
# stay denied via cast_possible_truncation/cast_possible_wrap.
cast_lossless = "allow"
# Warn on incompletes
unimplemented = "warn"
todo = "warn"

# Byte-order mistakes are silent data corruption, not a style nit.
disallowed_methods = "deny"

# Nothing here is worth running unoptimized. This profile only really exists
# for `cargo test`, which is where the round-trip tests chew through real
# game files.
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Offset arithmetic should trap rather than wrap into a bogus seek.
overflow-checks = true
