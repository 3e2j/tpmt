[workspace]
resolver = "3"
members = [
    "crates/tpmt",
    "crates/pipeline",
    "crates/retail-tests",
    "crates/game/binary",
    "crates/game/packaging/*",
    "crates/game/payload/formats/*",
    "crates/game/payload/tables",
    "crates/game/payload/documents",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/3e2j/tpmt"
license = "CC0-1.0"

[workspace.dependencies]
# Shared by every format: byte cursors and the Format trait.
tpmt-binary = { path = "crates/game/binary", version = "0.1.0" }

# Packaging: what unpacking removes and building puts back.
tpmt-disc = { path = "crates/game/packaging/disc", version = "0.1.0" }
tpmt-archive = { path = "crates/game/packaging/archive", version = "0.1.0" }
tpmt-compression = { path = "crates/game/packaging/compression", version = "0.1.0" }

# Payload: the files left after unpacking, their values, and editing them.
tpmt-message = { path = "crates/game/payload/formats/message", version = "0.1.0" }
tpmt-tables = { path = "crates/game/payload/tables", version = "0.1.0" }
tpmt-documents = { path = "crates/game/payload/documents", version = "0.1.0" }

tpmt-pipeline = { path = "crates/pipeline", version = "0.1.0" }

thiserror = "2"
rayon = "1"
libtest-mimic = "0.8"
clap = { version = "4", features = ["derive"] }
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Not 0.11. That release changed the output type and dropped its LowerHex impl,
# and every digest here is written out as hex.
sha1 = "0.10"
xxhash-rust = { version = "0.8", features = ["std", "xxh3"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Deny all panics
unwrap_used = "deny"
expect_used = "deny"
unreachable = "deny"
string_slice = "deny"
panic = "deny"
panic_in_result_fn = "deny"
exit = "deny"
unchecked_time_subtraction = "deny"
# Widening casts (u8 as u32, etc.) can't lose information. Truncating casts
# stay denied via cast_possible_truncation/cast_possible_wrap.
cast_lossless = "allow"
# Warn on incompletes
unimplemented = "warn"
todo = "warn"

# Byte-order mistakes are silent data corruption, not a style nit.
disallowed_methods = "deny"

# Nothing here is worth running unoptimized. This profile only really exists
# for `cargo test`, which is where the round-trip tests chew through real
# game files.
[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Offset arithmetic should trap rather than wrap into a bogus seek.
overflow-checks = true
